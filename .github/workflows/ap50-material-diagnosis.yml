name: AP50 Material publication diagnosis
on:
  push:
    branches: [feat/ap50-material-publication-check]
    paths: [.github/workflows/ap50-material-diagnosis.yml]
permissions:
  contents: read
jobs:
  publication:
    name: Published ESM / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fad008b1045e781c8efdac961a728453fd944c11
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: npm install --global npm@11.19.0
      - name: Verify source and unchanged dependency contract
        run: |
          test "$(git rev-parse HEAD)" = fad008b1045e781c8efdac961a728453fd944c11
          git status --porcelain
          node -p "JSON.stringify({node:process.version,engines:require('./package.json').engines,material:require('./package.json').dependencies['@material/material-color-utilities']})"
      - name: Read registry, verify real tarballs, reproduce native ESM
        run: |
          mkdir -p "$RUNNER_TEMP/material-publication"
          cd "$RUNNER_TEMP/material-publication"
          cat > probe.mjs <<'PROBE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          
          const pkg = '@material/material-color-utilities';
          const metadata = JSON.parse(execFileSync('npm', ['view', pkg, 'dist-tags', 'versions', 'time', '--json'], { encoding: 'utf8' }));
          writeFileSync('metadata.json', JSON.stringify(metadata, null, 2));
          console.log('UTC', new Date().toISOString());
          console.log('NODE', process.version);
          console.log('NPM', execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim());
          console.log('REGISTRY', JSON.stringify(metadata, null, 2));
          const latest = metadata['dist-tags'].latest;
          const versions = [...new Set(['0.3.0', '0.4.0', latest])];
          const results = [];
          for (const version of versions) {
            const target = join(process.cwd(), version);
            mkdirSync(target, { recursive: true });
            const manifest = JSON.parse(execFileSync('npm', ['view', pkg + '@' + version, 'version', 'dist', 'engines', 'peerDependencies', 'main', 'module', 'type', 'exports', '--json'], { encoding: 'utf8' }));
            writeFileSync(join(target, 'published.json'), JSON.stringify(manifest, null, 2));
            const pack = JSON.parse(execFileSync('npm', ['pack', pkg + '@' + version, '--ignore-scripts', '--json', '--pack-destination', target], { encoding: 'utf8' }))[0];
            writeFileSync(join(target, 'pack.json'), JSON.stringify(pack, null, 2));
            const archive = join(target, pack.filename);
            const bytes = readFileSync(archive);
            const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64');
            if (integrity !== manifest.dist.integrity || integrity !== pack.integrity) throw new Error('Tarball integrity mismatch for ' + version);
            const destination = join(target, 'node_modules', '@material', 'material-color-utilities');
            mkdirSync(destination, { recursive: true });
            execFileSync('tar', ['-xzf', archive, '--strip-components=1', '-C', destination]);
            const packageJson = JSON.parse(readFileSync(join(destination, 'package.json'), 'utf8'));
            console.log('PUBLISHED', JSON.stringify({ version, manifest, integrity, sha256: createHash('sha256').update(bytes).digest('hex'), packageJson }, null, 2));
            if (version !== '0.3.0') {
              const source = readFileSync(join(destination, 'dynamiccolor', 'color_spec_2025.js'), 'utf8');
              console.log('IMPORT LINES ' + version, source.split('\n').filter(line => line.startsWith('import ')).join('\n'));
            }
            const imported = spawnSync(process.execPath, ['--input-type=module', '-e', "const m = await import('@material/material-color-utilities'); console.log('NATIVE_IMPORT_OK', typeof m.Hct, Object.keys(m).length);"], { cwd: target, encoding: 'utf8' });
            writeFileSync(join(target, 'native-import.log'), (imported.stdout || '') + (imported.stderr || ''));
            console.log('NATIVE_IMPORT ' + version + ' EXIT ' + imported.status);
            console.log(imported.stdout);
            console.log(imported.stderr);
            results.push({ version, nativeImportExit: imported.status, integrity, publishedAt: metadata.time[version] });
          }
          writeFileSync('results.json', JSON.stringify({ latest, results }, null, 2));
          console.log('DECISION', JSON.stringify({ latest, results }, null, 2));
          if (results.find(result => result.version === '0.3.0').nativeImportExit !== 0) throw new Error('Baseline import failed');
          if (results.find(result => result.version === latest).nativeImportExit !== 0) throw new Error('BLOCKED: latest published native ESM import failed; no migration');
          PROBE
          node probe.mjs
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: material-publication-node-${{ matrix.node }}
          path: ${{ runner.temp }}/material-publication/
          if-no-files-found: error
          retention-days: 14
