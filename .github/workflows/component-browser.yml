name: Component browser runtime
on:
  push:
    branches: [feat/components]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --ignore-scripts
      - run: PLAYWRIGHT_BROWSERS_PATH=component-browsers npx playwright install chromium --only-shell
      - run: tar -czf component-browsers.tgz component-browsers
      - uses: actions/upload-artifact@v7
        with:
          name: component-browser
          path: component-browsers.tgz
