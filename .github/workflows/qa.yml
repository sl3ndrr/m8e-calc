name: Hardening QA
on:
  workflow_call:
    inputs:
      build-artifact-id:
        required: true
        type: string
      fingerprint:
        required: true
        type: string
permissions:
  contents: read
env:
  BUILD_FINGERPRINT: ${{ inputs.fingerprint }}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No token/repository/run-id override: only this workflow run, by producer ID.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.build-artifact-id }}
      - run: node scripts/ci/build-proof.mjs verify
      - run: node scripts/check-build-target.mjs dist normal
      - name: Measure bundle and contrast
        run: |
          status=0
          node scripts/qa-bundle.mjs || status=1
          node scripts/qa-contrast.mjs || status=1
          exit "$status"
      - name: Full audit
        if: always()
        run: |
          mkdir -p test-results/qa
          status=0
          npm audit --json > test-results/qa/audit.json || status=$?
          cat test-results/qa/audit.json
          exit "$status"
      - name: Lighthouse CI
        if: always()
        run: |
          status=0
          npx --yes --package @lhci/cli@0.15.1 lhci autorun || status=$?
          node scripts/qa-lighthouse.mjs || status=1
          exit "$status"
      - run: node scripts/ci/build-proof.mjs verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-measure
          path: |
            test-results/
            .lighthouseci/
          retention-days: 14
  browsers:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, qa-performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No token/repository/run-id override: only this workflow run, by producer ID.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.build-artifact-id }}
      - run: node scripts/ci/build-proof.mjs verify
      - run: node scripts/check-build-target.mjs dist normal
      - run: npx playwright install --with-deps chromium firefox webkit
      # Run WebKit timing regressions in isolation.
      - name: Browser gates
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-results.json
        run: |
          browser_workers=()
          if [ "${{ matrix.project }}" = webkit ]; then browser_workers=(--workers=1); fi
          npx playwright test --project=${{ matrix.project }} "${browser_workers[@]}" --reporter=list,json
      - run: node scripts/ci/build-proof.mjs verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-browsers-${{ matrix.project }}
          path: test-results/
          retention-days: 14
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No token/repository/run-id override: only this workflow run, by producer ID.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.build-artifact-id }}
      - run: node scripts/ci/build-proof.mjs verify
      - run: node scripts/check-build-target.mjs dist normal
      - run: npx playwright install --with-deps chromium
      - name: Compare committed references
        run: npx playwright test --project=qa-visual
      - run: node scripts/ci/build-proof.mjs verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-visual
          path: |
            test-results/
            e2e/qa-visual.spec.ts-snapshots/
          retention-days: 14

  quality:
    name: QA gate
    if: ${{ always() }}
    needs: [measure, browsers, visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Require every QA matrix and visual job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/quality-status.mjs qa
