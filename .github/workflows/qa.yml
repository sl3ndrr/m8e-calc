name: Hardening QA
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare pinned baseline
        if: matrix.phase == 'before'
        run: |
          git fetch --depth=1 origin 67d9c9688d1cc7169a73262b21e738ff09c8bcda
          git worktree add .qa-baseline FETCH_HEAD
          cp scripts/qa-*.mjs .qa-baseline/scripts/
          cp lighthouserc.cjs .qa-baseline/
          cd .qa-baseline
          npm ci
      - name: Build and measure
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          if [ "$PHASE" = before ]; then cd .qa-baseline; export QA_BASELINE=1; fi
          npx vite build --manifest
          status=0
          node scripts/qa-bundle.mjs || status=1
          node scripts/qa-contrast.mjs || status=1
          exit "$status"
      - name: Full audit
        if: always()
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          if [ "$PHASE" = before ]; then cd .qa-baseline; fi
          mkdir -p test-results/qa
          status=0
          npm audit --json > test-results/qa/audit.json || status=$?
          cat test-results/qa/audit.json
          if [ "$PHASE" = after ]; then exit "$status"; fi
      - name: Lighthouse CI
        if: always()
        continue-on-error: ${{ matrix.phase == 'before' }}
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          if [ "$PHASE" = before ]; then cd .qa-baseline; fi
          status=0
          npx --yes --package @lhci/cli@0.15.1 lhci autorun || status=$?
          node scripts/qa-lighthouse.mjs || status=1
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-${{ matrix.phase }}
          path: |
            test-results/
            .lighthouseci/
            .qa-baseline/test-results/
            .qa-baseline/.lighthouseci/
          retention-days: 14
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --project=chromium --project=firefox --project=webkit --project=qa-performance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-browsers
          path: test-results/
          retention-days: 14
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Compare committed references
        run: npx playwright test --project=qa-visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-visual
          path: |
            test-results/
            e2e/qa-visual.spec.ts-snapshots/
          retention-days: 14
