name: AP33 registry evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    if: github.head_ref == 'feat/ap33-dependency-decisions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read current registry contracts (no app install)
        run: |
          node --version
          npm --version
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const specs = ['eslint@latest', '@eslint/js@latest', 'eslint-plugin-jsx-a11y@latest', 'typescript-eslint@latest', '@typescript-eslint/parser@latest', '@typescript-eslint/eslint-plugin@latest', 'eslint-plugin-react-hooks@latest', 'typescript@latest', '@types/node@latest', '@types/node@24', '@material/material-color-utilities@latest'];
          const results = specs.map(spec => ({ spec, metadata: JSON.parse(execFileSync('npm', ['view', spec, 'version', 'engines', 'peerDependencies', 'peerDependenciesMeta', 'dependencies', 'dist.tarball', 'dist.integrity', '--json'], { encoding: 'utf8' })) }));
          console.log('AP33_METADATA=' + JSON.stringify({ queriedAt: new Date().toISOString(), node: process.version, results }));
          NODE
      - name: Inspect published Material package in temporary directory
        run: |
          cd "$RUNNER_TEMP"
          npm pack @material/material-color-utilities@latest --ignore-scripts --json > packed.json
          node -e "console.log('AP33_PACK=' + require('./packed.json')[0].filename)"
          tar -xzf "$(node -p "require('./packed.json')[0].filename")"
          cat package/package.json
          sed -n '1,90p' package/dynamiccolor/color_spec_2025.js
          node --input-type=module -e "try { await import('./package/index.js'); console.log('AP33_NATIVE_IMPORT=success') } catch (e) { console.log('AP33_NATIVE_IMPORT=' + e.code + ': ' + e.message) }"
