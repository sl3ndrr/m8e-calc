name: AP33 completion evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.head_ref == 'feat/ap33-dependency-decisions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx --yes prettier@3.9.10 --write e2e/calculator-rendering.spec.ts docs/AP33.md docs/ROADMAP.md
      - run: node scripts/check-release-docs.mjs
      - name: Report exact formatted contents
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ['e2e/calculator-rendering.spec.ts', 'docs/AP33.md', 'docs/ROADMAP.md'])
            console.log('AP33_FORMATTED=' + JSON.stringify({path,content:readFileSync(path,'utf8')}));
          NODE
  press:
    if: github.head_ref == 'feat/ap33-dependency-decisions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --yes prettier@3.9.10 --write e2e/calculator-rendering.spec.ts docs/AP33.md docs/ROADMAP.md
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Real operator inputs and recorder controls twice in all engines, no retries
        run: npx playwright test e2e/calculator-rendering.spec.ts --project=chromium --project=firefox --project=webkit --grep 'operator.*shapes|pointer recorder' --workers=1 --repeat-each=2 --retries=0 --reporter=list --output=test-results/ap33-press
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap33-press-evidence
          path: test-results/ap33-press/
          retention-days: 14
