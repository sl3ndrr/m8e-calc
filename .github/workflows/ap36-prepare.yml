name: AP36 lockfile preparation
on:
  push:
    branches: [feat/ap36-motion14]
    paths: [.github/workflows/ap36-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: npm install --global npm@11.19.0
      - name: Official registry metadata and ordinary lockfile
        run: |
          mkdir -p test-results/ap36-preparation
          node --version
          npm --version
          npm view motion dist-tags versions --json > test-results/ap36-preparation/registry.json
          npm view motion@14.4.0 version engines peerDependencies dependencies dist --json > test-results/ap36-preparation/target.json
          cat test-results/ap36-preparation/target.json
          npm install --package-lock-only --ignore-scripts 'motion@^14.4.0'
          cp package.json package-lock.json test-results/ap36-preparation/
          git diff -- package.json package-lock.json > test-results/ap36-preparation/lockfile.diff
          cat test-results/ap36-preparation/lockfile.diff
      - run: npm ci --engine-strict
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap36-preparation
          path: test-results/ap36-preparation/
          retention-days: 14
