name: AP27 implicit integration evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ap27-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    if: github.head_ref == 'feat/ap27-implicit-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Graph integration in three engines
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ap27/results.json
        run: npx playwright test e2e/graph.spec.ts e2e/graph-values.spec.ts e2e/graph-implicit.spec.ts --project=chromium --project=firefox --project=webkit --workers=2 --reporter=list,json --output=test-results/ap27/browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap27-implicit-evidence
          path: |
            test-results/
            dist/build-info.json
          retention-days: 14
