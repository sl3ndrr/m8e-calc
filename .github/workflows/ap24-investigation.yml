name: AP24 dependency investigation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    if: github.head_ref == 'feat/ap24-dependency-maintenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: npm ci
      - name: Format final maintenance files for review
        run: |
          npx prettier --write package.json eslint.config.js .github/dependabot.yml docs/AP24.md docs/ap24-package-metadata.json docs/ROADMAP.md AGENTS.md e2e/scientific.spec.ts .github/workflows/ap24-investigation.yml
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const path of ['package.json','eslint.config.js','.github/dependabot.yml','docs/AP24.md','docs/ap24-package-metadata.json','docs/ROADMAP.md','AGENTS.md','e2e/scientific.spec.ts']) console.log('AP24_FORMATTED',JSON.stringify({path,content:readFileSync(path,'utf8')}));
          NODE
      - run: npm run check
      - run: npm audit --json
      - name: Confirm committed icon subsets are untouched
        run: git diff --exit-code origin/main -- src/styles/fonts
