name: AP24 dependency investigation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    if: github.head_ref == 'feat/ap24-dependency-maintenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Probe material color migration without changing baselines
        continue-on-error: true
        run: |
          cp package.json /tmp/ap24-package.json
          cp package-lock.json /tmp/ap24-package-lock.json
          npm install --package-lock-only @material/material-color-utilities@0.4.0
          npm ci
          npx vitest run src/styles/buildScheme.test.ts
          npm run typecheck
      - name: Restore selected maintenance versions
        if: always()
        run: |
          cp /tmp/ap24-package.json package.json
          cp /tmp/ap24-package-lock.json package-lock.json
          rm -rf node_modules
      - name: Generate lockfile with bundled npm
        run: |
          node --version
          npm --version
          test "$(npm --version)" = 11.19.0
          npm install --package-lock-only
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {gzipSync} from 'node:zlib';
          console.log('AP24_LOCK_GZIP_BASE64='+gzipSync(readFileSync('package-lock.json')).toString('base64'));
          NODE
      - name: Fresh clean installation
        run: npm ci
      - name: Inspect full dependency tree
        run: npm ls --all
      - name: Format maintenance changes for review
        run: |
          npx prettier --write package.json eslint.config.js .github/workflows/ap24-investigation.yml
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const path of ['package.json','eslint.config.js','.github/workflows/ap24-investigation.yml']) console.log('AP24_FORMATTED',JSON.stringify({path,content:readFileSync(path,'utf8')}));
          NODE
      - name: Run unchanged quality gates
        run: npm run check
      - name: Audit
        if: always()
        run: npm audit --json
