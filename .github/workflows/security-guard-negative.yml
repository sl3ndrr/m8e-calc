name: Security guard negative probe
on:
  push:
    branches: [feat/security-minimatch-guard-negative]
permissions:
  contents: read
jobs:
  guard:
    name: Missing patch must fail in npm run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - name: npm run check (expected guard failure)
        run: npm run check
