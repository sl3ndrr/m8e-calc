name: Convert validation
on:
  push:
    branches: [feat/convert-mode]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format converter changes for validation
        run: |
          npx prettier --write src/features/convert src/ui/Select.tsx src/ui/Select.css src/shared/historyStore.ts src/shared/i18n/de.ts src/shared/i18n/en.ts e2e/convert.spec.ts docs/CONVERT_MODE.md docs/COMPONENTS.md docs/ROADMAP.md AGENTS.md .github/workflows/convert-validation.yml
          mkdir -p validation
          git diff > validation/format.patch
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: convert-validation-results
          path: |
            validation/format.patch
            test-results/
          retention-days: 7
