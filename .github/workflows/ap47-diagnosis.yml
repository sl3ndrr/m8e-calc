name: AP49 official SOFA source preflight
on:
  push:
    branches: [feat/ap47-bounded-diagnosis]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Published IAU SOFA source, one request, unchanged thirty-second bound
        run: |
          mkdir -p test-results
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const url='https://www.iausofa.org/s/sofa_ts_f.pdf';
          const result={url,attempt:1,timeoutMs:30000,source:process.env.GITHUB_SHA,checkedAt:new Date().toISOString()};
          try {
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            const body=Buffer.from(await response.arrayBuffer());
            Object.assign(result,{status:response.status,finalUrl:response.url,contentType:response.headers.get('content-type'),bytes:body.length,sha256:createHash('sha256').update(body).digest('hex')});
          } catch(error) {Object.assign(result,{error:error.message,cause:error.cause?.message,code:error.cause?.code});}
          writeFileSync('test-results/official-source.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          if(result.status!==200||!result.contentType?.includes('application/pdf'))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap49-sofa-source-preflight
          path: test-results/
          retention-days: 14
