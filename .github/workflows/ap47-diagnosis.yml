name: AP49 bounded native-source raster comparison
on:
  push:
    branches: [feat/ap47-bounded-diagnosis]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Native pixel parity, full check, fixed original then bounded raster
        run: |
          npm run build || exit 1
          npx playwright test --config=playwright.ap49-raster.config.ts --workers=1 --retries=0 --reporter=list --output=test-results/ap49-bounded-pixels || exit 1
          npm run check || exit 1
          status=0
          cp src/features/graph/renderer.ts "$RUNNER_TEMP/ap49-renderer.ts"
          for ap49_variant in original bounded; do
            if [ "$ap49_variant" = original ]; then
              cp diagnostics/ap49-renderer-before.txt src/features/graph/renderer.ts
            else
              cp "$RUNNER_TEMP/ap49-renderer.ts" src/features/graph/renderer.ts
            fi
            npm run build || exit 1
            AP49_GRID_VARIANT="$ap49_variant" npx playwright test --config=playwright.ap28.config.ts --workers=1 --retries=0 --reporter=list --output="test-results/ap49/$ap49_variant" || status=1
            mkdir -p "test-results/ap49/$ap49_variant/raw"
            cp test-results/ap28/* "test-results/ap49/$ap49_variant/raw/"
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap49-bounded-raster-comparison
          path: test-results/
          retention-days: 14
