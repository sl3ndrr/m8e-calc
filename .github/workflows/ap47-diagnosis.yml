name: AP49 source raster isolation
on:
  push:
    branches: [feat/ap47-bounded-diagnosis]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Isolate native source, integer image copies and patterns
        run: |
          npm run build
          npx playwright test --config=playwright.ap49-raster.config.ts --workers=1 --retries=0 --reporter=list --output=test-results/ap49-source
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap49-source-isolation
          path: test-results/
          retention-days: 14
