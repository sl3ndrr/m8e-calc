name: AP49 fixed canvas resource comparison
on:
  push:
    branches: [feat/ap47-bounded-diagnosis]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Fixed opaque then alpha-capable context; original windows and limits
        run: |
          status=0
          for ap49_variant in opaque alpha; do
            AP49_CONTEXT_VARIANT="$ap49_variant" npx playwright test --config=playwright.ap28.config.ts --workers=1 --retries=0 --reporter=list --output="test-results/ap49/$ap49_variant" || status=1
            mkdir -p "test-results/ap49/$ap49_variant/raw"
            cp test-results/ap28/* "test-results/ap49/$ap49_variant/raw/"
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap49-canvas-resource-comparison
          path: test-results/
          retention-days: 14
