name: AP49 fixed Canvas backing comparison
on:
  push:
    branches: [feat/ap47-bounded-diagnosis]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Fixed product then CPU-backed context, original references and limits
        run: |
          status=0
          for ap49_hint in product cpu; do
            AP49_CANVAS_HINT="$ap49_hint" npx playwright test --config=playwright.ap28.config.ts --workers=1 --retries=0 --reporter=list --output="test-results/ap49/$ap49_hint" || status=1
            mkdir -p "test-results/ap49/$ap49_hint/raw"
            cp test-results/ap28/* "test-results/ap49/$ap49_hint/raw/"
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap49-canvas-backing-comparison
          path: |
            test-results/
            dist/build-info.json
          retention-days: 14
