name: Release assets
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format release sources
        run: npx prettier --write README.md CHANGELOG.md AGENTS.md docs/ROADMAP.md docs/PRODUCT_SPEC.md docs/RELEASE.md docs/RELEASE_NOTES_1.0.md scripts/release-screenshots.mjs .github/workflows/release-assets.yml package.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-assets
          path: |
            docs/img/
            README.md
            CHANGELOG.md
            AGENTS.md
            docs/ROADMAP.md
            docs/PRODUCT_SPEC.md
            docs/RELEASE.md
            docs/RELEASE_NOTES_1.0.md
            scripts/release-screenshots.mjs
            .github/workflows/release-assets.yml
            package.json
          include-hidden-files: true
          retention-days: 14
