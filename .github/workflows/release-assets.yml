name: Release assets
on:
  workflow_call:
    inputs:
      build-artifact-id:
        required: true
        type: string
      fingerprint:
        required: true
        type: string
permissions:
  contents: read
env:
  BUILD_FINGERPRINT: ${{ inputs.fingerprint }}
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No token/repository/run-id override: only this workflow run, by producer ID.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.build-artifact-id }}
      - run: node scripts/ci/build-proof.mjs verify
      - run: node scripts/check-build-target.mjs dist normal
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - name: Check documentation links and commands
        run: node scripts/check-release-docs.mjs --external
      - run: node scripts/ci/build-proof.mjs verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-assets
          path: docs/img/
          retention-days: 14

