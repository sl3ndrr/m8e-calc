name: AP36 Motion migration evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ap36-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  evidence:
    if: github.head_ref == 'feat/ap36-motion14'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Same-run Motion 12 baseline, original lockfile
        id: before
        continue-on-error: true
        run: |
          baseline="$RUNNER_TEMP/ap36-before"
          git fetch --depth=1 origin 964f6b4e7d605d7b2e73248c1ed9ac3e32fe2839
          git worktree add "$baseline" FETCH_HEAD
          cp e2e/ap36*.ts "$baseline/e2e/"
          cp playwright.ap36.config.ts "$baseline/"
          cd "$baseline"
          npm ci --engine-strict
          export GITHUB_SHA=964f6b4e7d605d7b2e73248c1ed9ac3e32fe2839
          export AP30_SOURCE="$GITHUB_SHA"
          npm run build
          node scripts/ap30-measure.mjs "$GITHUB_WORKSPACE/test-results/ap36/before/budget"
          npm run build:gallery
          AP36_PHASE=before npx playwright test --config=playwright.ap36.config.ts --project=chromium-production --project=chromium-gallery --max-failures=3 --reporter=list --output="$GITHUB_WORKSPACE/test-results/ap36/before/browser"
      - name: Motion 14 candidate with fresh installation
        id: after
        if: ${{ !cancelled() }}
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AP30_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run build
          node scripts/ap30-measure.mjs test-results/ap36/after/budget
          npm run build:gallery
      - name: Candidate interaction probes
        id: interactions
        if: ${{ !cancelled() }}
        run: npx playwright test --config=playwright.ap36.config.ts --project=chromium-production --project=chromium-gallery --max-failures=3 --reporter=list --output=test-results/ap36/after/browser
      - name: Require every evidence phase
        if: ${{ always() }}
        env:
          BEFORE: ${{ steps.before.outcome }}
          AFTER: ${{ steps.interactions.outcome }}
        run: |
          test "$BEFORE" = success
          test "$AFTER" = success
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap36-motion-evidence
          path: |
            test-results/ap36/
            test-results/graph-performance.json
            test-results/graph-implicit-ui-performance.json
          retention-days: 14
