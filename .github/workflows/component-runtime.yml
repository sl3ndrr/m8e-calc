name: Component test runtime
on:
  push:
    branches: [feat/components]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --ignore-scripts
      - run: tar --exclude='node_modules/material-symbols' -czf component-node-modules.tgz node_modules
      - name: Export dependency lock
        run: |
          node -e "const z=require('node:zlib'),fs=require('node:fs');console.log('LOCK_DATA='+z.gzipSync(fs.readFileSync('package-lock.json')).toString('base64'))"
      - uses: actions/upload-artifact@v7
        with:
          name: component-dependencies
          path: |
            component-node-modules.tgz
            package-lock.json
            node_modules/react-aria-components/dist/types.d.ts
