name: AP20 controls evidence
on:
  pull_request:
    branches: [main]
concurrency:
  group: ap20-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  controls:
    if: github.head_ref == 'feat/ap20-controls-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format prepared changes
        run: |
          npx prettier --write src/ui/Checkbox.* src/ui/ThemeSwitch.* src/ui/components.test.tsx e2e/controls-*.spec.ts docs/AP20.md docs/ROADMAP.md docs/DESIGN.md docs/COMPONENTS.md AGENTS.md .github/workflows/ap20.yml
          git diff
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/controls-polish.spec.ts e2e/controls-native-zoom.spec.ts e2e/theming.spec.ts e2e/components.spec.ts e2e/graph.spec.ts --project=chromium --workers=2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap20-controls
          path: test-results/
          retention-days: 14
