name: AP34 formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.head_ref == 'feat/ap34-jsdom30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - name: Format and return exact corrections
        run: |
          npx --no-install prettier --write package.json package-lock.json AGENTS.md README.md docs/AP34.md docs/ROADMAP.md docs/ap34-package-metadata.json .github/workflows/ci.yml scripts/ci/quality-status.mjs
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const p = execFileSync('git', ['diff']).toString('base64');
          for (let i = 0; i < p.length; i += 6000) console.log('AP34_FORMAT:' + p.slice(i, i + 6000));
          JS
