name: AP34 investigation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  investigate:
    if: github.head_ref == 'feat/ap34-jsdom30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          check-latest: true
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v8
        with:
          name: ap34-baseline
          run-id: 39231316675
          github-token: ${{ github.token }}
          path: /tmp/ap34-baseline
      - name: Select reviewed target and generate regular lockfile
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json'));
          p.engines.node = '>=24.15.0 <25';
          p.devDependencies.jsdom = '^30.1.3';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
          npm install --package-lock-only
          node --version
          npm --version
      - name: Official metadata, resolved contracts, source audit and generated patch
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const names = ['jsdom', 'vite', 'vitest', '@vitejs/plugin-react', '@types/node', 'react-aria-components', '@codemirror/view', '@testing-library/user-event'];
          const metadata = { capturedAt: new Date().toISOString(), node: process.version, npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), packages: {} };
          for (const name of names) {
            const version = lock.packages['node_modules/' + name].version;
            metadata.packages[name] = JSON.parse(execFileSync('npm', ['view', name + '@' + version, 'version', 'engines', 'peerDependencies', 'peerDependenciesMeta', 'deprecated', '--json'], { encoding: 'utf8' }));
          }
          metadata.engines = Object.entries(lock.packages).filter(([,p]) => p.engines?.node).map(([path,p]) => ({ path, version: p.version, node: p.engines.node }));
          metadata.jsdom30 = JSON.parse(execFileSync('npm', ['view', 'jsdom@30', 'version', 'engines', 'peerDependencies', 'deprecated', '--json'], { encoding: 'utf8' }));
          fs.writeFileSync('/tmp/ap34-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          for (const [label, content] of [['PATCH', execFileSync('git', ['diff', '--', 'package.json', 'package-lock.json'])], ['METADATA', fs.readFileSync('/tmp/ap34-metadata.json')]]) {
            const encoded = Buffer.from(content).toString('base64');
            for (let i = 0; i < encoded.length; i += 6000) console.log('AP34_' + label + ':' + encoded.slice(i, i + 6000));
          }
          JS
          for version in v28.0.0 v29.0.0 v30.0.0 v30.1.3; do
            curl --fail --silent --show-error "https://api.github.com/repos/jsdom/jsdom/releases/tags/$version" | jq -r .body
          done
          grep -R -n -E 'ResourceLoader|JSDOM|environmentOptions|PointerEvent|MouseEvent|pointerType' src vite.config.ts || test "$?" = 1
      - run: npm ci --engine-strict
      - name: Migrated full UI project
        run: npx vitest run --project=ui --reporter=json --outputFile=/tmp/ap34-after-ui.json
      - name: Migrated full engine project
        if: ${{ !cancelled() }}
        run: npx vitest run --project=engine --reporter=json --outputFile=/tmp/ap34-after-engine.json
      - name: Compare exact test identities and status
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for (const project of ['ui', 'engine']) {
            const before = JSON.parse(fs.readFileSync('/tmp/ap34-baseline/ap34-before-' + project + '.json'));
            const after = JSON.parse(fs.readFileSync('/tmp/ap34-after-' + project + '.json'));
            const inventory = (r) => r.testResults.flatMap(s => s.assertionResults.map(t => ({ name: s.name.replace(/^.*\/src\//, 'src/') + ':' + t.fullName, status: t.status }))).sort((a, b) => a.name.localeCompare(b.name));
            assert.deepEqual(inventory(after), inventory(before));
            console.log(JSON.stringify({ project, files: after.testResults.length, tests: after.numTotalTests, passed: after.numPassedTests, failed: after.numFailedTests, pending: after.numPendingTests, identicalInventoryAndStatus: true }));
          }
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap34-migration
          path: |
            /tmp/ap34-after-*.json
            /tmp/ap34-metadata.json
            package-lock.json
