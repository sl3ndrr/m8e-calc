name: Engine validation snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format engine snapshot
        run: npx prettier --write src/engine docs/ENGINE.md docs/ARCHITECTURE.md docs/ROADMAP.md AGENTS.md package.json vite.config.ts scripts/engine-benchmark.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: engine-validation-snapshot
          path: |
            src/engine/
            docs/ENGINE.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            AGENTS.md
            package.json
            vite.config.ts
            scripts/engine-benchmark.mjs
      - run: npm run check
