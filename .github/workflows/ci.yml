name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npx prettier --write .
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Bootstrap local verification bundle
        if: always()
        run: tar -czf foundation-bootstrap.tar.gz --exclude=foundation-bootstrap.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-bootstrap
          path: foundation-bootstrap.tar.gz
          retention-days: 1
