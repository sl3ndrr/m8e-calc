name: CI
on:
  pull_request:
  push:
    branches: [main, feat/foundation, feat/components]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  currency-source:
    if: github.head_ref == 'feat/currency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-currency-source.mjs
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Reproduce AP21 baseline without deployment
        run: |
          git fetch --depth=1 origin f48afe1e0bdb5baf42eb1ec194883ecdc1c41e87
          git worktree add /tmp/ap21-baseline FETCH_HEAD
          ln -s "$PWD/node_modules" /tmp/ap21-baseline/node_modules
          (cd /tmp/ap21-baseline && npm run build)
          node scripts/graph-fit-reproduction.mjs /tmp/ap21-baseline
      - run: npx playwright test --project=chromium --project=chromium-graph-performance
      - name: Gallery screenshots
        if: success()
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/m8e-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4173/m8e-calc/ > /dev/null && break; sleep 1; done
          npm run screenshots:gallery
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            docs/screenshots/components-*.png
            docs/screenshots/comfort-*.png
          retention-days: 7
