name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Serialize main through deployment. PR updates may cancel obsolete checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  promotion:
    name: Reuse approved PR artifact
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sl3ndrr/m8e-calc' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outcome == 'success' && steps.upload.outputs.artifact-id || '' }}
      artifact-name: ${{ steps.upload.outcome == 'success' && format('pages-promoted-{0}-{1}', github.run_id, github.run_attempt) || '' }}
      tar-sha256: ${{ steps.upload.outcome == 'success' && steps.verify.outputs.tar-sha256 || '' }}
      source-commit: ${{ steps.upload.outcome == 'success' && steps.verify.outputs.source-commit || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Find the successful PR attempt and compare Git trees
        id: discover
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/pages-promotion.mjs discover "$RUNNER_TEMP/pages-expected.json"
      - name: Download the Quality gate approval
        id: approval
        if: ${{ steps.discover.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.discover.outputs.run-id }}
          artifact-ids: ${{ steps.discover.outputs.approval-id }}
          path: ${{ runner.temp }}/pages-approval
      - name: Download the approved archive by ID
        id: archive
        if: ${{ steps.approval.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.discover.outputs.run-id }}
          artifact-ids: ${{ steps.discover.outputs.pages-id }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Verify the approval and exact Pages archive
        id: verify
        if: ${{ steps.archive.outcome == 'success' }}
        continue-on-error: true
        run: |
          node scripts/ci/pages-promotion.mjs verify "$RUNNER_TEMP/pages-expected.json" \
            "$RUNNER_TEMP/pages-approval/approval.json" "$RUNNER_TEMP/pages-artifact/artifact.tar"
      - name: Upload the same archive for this Pages workflow run
        id: upload
        if: ${{ steps.verify.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pages-promoted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-artifact/artifact.tar
          if-no-files-found: error
          retention-days: 14
      - name: Record full CI fallback
        if: ${{ !cancelled() && steps.upload.outcome != 'success' }}
        run: echo 'No verified PR archive was uploaded. Running full CI on main.' >> "$GITHUB_STEP_SUMMARY"
  gate-tests:
    name: Pipeline contract tests
    needs: promotion
    if: ${{ !cancelled() && (needs.promotion.result != 'success' || needs.promotion.outputs.artifact-id == '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: node --test scripts/ci/*.test.mjs
      - run: node scripts/check-release-docs.mjs
      - name: Check pipeline formatting and print proposed corrections
        run: |
          npx --yes prettier@3.9.10 --write .github/workflows/*.yml scripts/ci/*.mjs scripts/check-release-docs.mjs README.md AGENTS.md CHANGELOG.md docs
          git diff --exit-code
      - name: Validate all workflow syntax and dependencies
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
  node-minimum:
    name: Node 24 minimum
    needs: promotion
    if: ${{ !cancelled() && (needs.promotion.result != 'success' || needs.promotion.outputs.artifact-id == '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - run: npm install --global npm@11.19.0
      - run: node --version && npm --version
      - run: npm ci --engine-strict
      - run: npm run check
  build:
    name: Production build
    needs: promotion
    if: ${{ !cancelled() && (needs.promotion.result != 'success' || needs.promotion.outputs.artifact-id == '') }}
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      fingerprint: ${{ steps.proof.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - run: npm run check
      - id: proof
        run: node scripts/ci/build-proof.mjs seal
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: checked-normal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            build-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  qa:
    name: Hardening QA
    needs: build
    # A skipped promotion on PRs must not skip checks of a successful build.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/qa.yml
    with:
      build-artifact-id: ${{ needs.build.outputs.artifact-id }}
      fingerprint: ${{ needs.build.outputs.fingerprint }}
  provenance:
    name: Build provenance
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/build-provenance.yml
    with:
      build-artifact-id: ${{ needs.build.outputs.artifact-id }}
      fingerprint: ${{ needs.build.outputs.fingerprint }}
  release-assets:
    name: Release assets
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/release-assets.yml
    with:
      build-artifact-id: ${{ needs.build.outputs.artifact-id }}
      fingerprint: ${{ needs.build.outputs.fingerprint }}
  graph-performance:
    name: Graph performance
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      BUILD_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      # No token/repository/run-id override: only this workflow run, by producer ID.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
      - run: node scripts/ci/build-proof.mjs verify
      - run: node scripts/check-build-target.mjs dist normal
      - run: npx playwright install --with-deps chromium
      - name: Fixed windows and intentional slow controls
        run: npx playwright test --project=chromium-graph-controls --reporter=list --output=test-results/graph-controls
      - name: 4K and mixed 2D budgets
        run: npx playwright test --project=chromium-graph-performance --no-deps --workers=1 --reporter=list --output=test-results/graph-performance
      - run: node scripts/ci/build-proof.mjs verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-performance
          path: test-results/
          retention-days: 14
  gallery:
    name: Gallery
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      BUILD_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      # No token/repository/run-id override: only this workflow run, by producer ID.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
      - run: node scripts/ci/build-proof.mjs verify
      - run: node scripts/check-build-target.mjs dist normal
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:gallery
      - run: npm run test:e2e:gallery -- --output=test-results/gallery
      - name: Gallery screenshots
        run: |
          npm run preview:gallery -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/m8e-preview.log 2>&1 &
          for _attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4174/m8e-calc/ > /dev/null && break; sleep 1; done
          npm run screenshots:gallery
      - name: Normal bytes unchanged; gallery rejected
        run: |
          node scripts/ci/build-proof.mjs verify
          if node scripts/check-build-target.mjs dist-gallery normal; then exit 1; fi
          if node scripts/ci/build-proof.mjs verify dist-gallery; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gallery
          path: test-results/
          retention-days: 14
  pages-package:
    name: Pages artifact verification
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      tar-sha256: ${{ steps.tar.outputs.sha256 }}
      artifact-name: pages-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      BUILD_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      # No token/repository/run-id override: only this workflow run, by producer ID.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
      - run: node scripts/ci/build-proof.mjs verify
      - run: node scripts/check-build-target.mjs dist normal
      - name: Reject wrong SHA and foreign artifact context on the actual build
        run: |
          if GITHUB_SHA=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb node scripts/ci/build-proof.mjs verify; then exit 1; fi
          echo "Wrong SHA rejected"
          if GITHUB_REPOSITORY=foreign/untrusted node scripts/ci/build-proof.mjs verify; then exit 1; fi
          echo "Foreign repository rejected"
          if GITHUB_RUN_ID=0 node scripts/ci/build-proof.mjs verify; then exit 1; fi
          echo "Foreign run rejected"
          node scripts/ci/build-proof.mjs verify
      - name: Package every verified byte, including the Vite manifest; verify round trip
        id: tar
        run: |
          tar --directory dist -cf "$RUNNER_TEMP/artifact.tar" .
          mkdir "$RUNNER_TEMP/pages-roundtrip"
          tar --extract --file "$RUNNER_TEMP/artifact.tar" --directory "$RUNNER_TEMP/pages-roundtrip"
          node scripts/ci/build-proof.mjs verify "$RUNNER_TEMP/pages-roundtrip"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 14
  quality:
    name: Quality gate
    # The full gate keeps its existing checks and PR status name.
    if: ${{ always() && (github.event_name == 'pull_request' || needs.build.result != 'skipped') }}
    needs:
      [
        build,
        gate-tests,
        node-minimum,
        qa,
        graph-performance,
        gallery,
        provenance,
        release-assets,
        pages-package,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Fail closed on every required job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          node scripts/ci/quality-status.mjs quality
      - name: Record the approved PR archive
        id: approval
        if: >-
          ${{ github.event_name == 'pull_request' && github.repository == 'sl3ndrr/m8e-calc' &&
              github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PAGES_ARTIFACT_ID: ${{ needs.pages-package.outputs.artifact-id }}
          PAGES_ARTIFACT_NAME: ${{ needs.pages-package.outputs.artifact-name }}
          PAGES_TAR_SHA256: ${{ needs.pages-package.outputs.tar-sha256 }}
        run: node scripts/ci/pages-promotion.mjs approve "$RUNNER_TEMP/approval.json"
      - uses: actions/upload-artifact@v7
        if: ${{ steps.approval.outcome == 'success' }}
        with:
          name: pages-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approval.json
          if-no-files-found: error
          retention-days: 14
  deploy:
    name: Deploy Pages
    needs: [promotion, quality, pages-package]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'sl3ndrr/m8e-calc' &&
          ((needs.promotion.result == 'success' && needs.promotion.outputs.artifact-id != '') ||
           (needs.quality.result == 'success' && needs.pages-package.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.artifact-id || needs.pages-package.outputs.artifact-id }}
          path: ${{ runner.temp }}/pages-upload
      - name: Verify the exact upload archive
        env:
          EXPECTED_TAR_SHA256: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.tar-sha256 || needs.pages-package.outputs.tar-sha256 }}
        run: |
          test "${#EXPECTED_TAR_SHA256}" -eq 64
          echo "$EXPECTED_TAR_SHA256  $RUNNER_TEMP/pages-upload/artifact.tar" | sha256sum --check
      # This check is inside the deployment lock, immediately before the API call.
      - name: Reject superseded main or any non-production context
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.artifact-id != '' && 'success' || needs.quality.result }}
          SOURCE_COMMIT: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.source-commit || github.sha }}
        run: |
          printf 'Checked build SHA: %s\n\nPublication main SHA: %s\n' "$SOURCE_COMMIT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          export LATEST_MAIN
          LATEST_MAIN=$(gh api repos/sl3ndrr/m8e-calc/git/ref/heads/main --jq .object.sha)
          node scripts/ci/quality-status.mjs publish
      - name: Deploy the verified archive from this run
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.artifact-name || needs.pages-package.outputs.artifact-name }}
