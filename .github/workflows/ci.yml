name: CI
on:
  pull_request:
  push:
    branches: [main, feat/foundation, feat/components]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  currency-source:
    if: github.head_ref == 'feat/currency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-currency-source.mjs
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=chromium-graph-performance
      - run: npm run build:gallery
      - run: npm run test:e2e:gallery
      - name: Gallery screenshots
        if: success()
        run: |
          npm run preview:gallery -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/m8e-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4174/m8e-calc/ > /dev/null && break; sleep 1; done
          npm run screenshots:gallery
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            docs/screenshots/components-*.png
            docs/screenshots/comfort-*.png
          retention-days: 7
