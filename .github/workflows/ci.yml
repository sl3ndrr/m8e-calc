name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Serialize main through deployment. PR updates may cancel obsolete checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  wp09-security:
    name: WP09 security migration investigation
    if: github.head_ref == 'feat/audit-wp-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: npm install --global npm@11.19.0
      - run: npm ci --engine-strict
      - name: Bundled scoped minimatch repair, parity and clean install
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, readFileSync, readdirSync, writeFileSync, rmSync, statSync } from 'node:fs';
          import { resolve, relative, dirname } from 'node:path';
          import { createHash } from 'node:crypto';
          
          const output = resolve('test-results/wp09-security');
          mkdirSync(output, { recursive: true });
          const commands = [];
          function run(name, command, args, cwd = process.cwd()) {
            const result = spawnSync(command, args, { cwd, encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
            writeFileSync(`${output}/${name}.stdout`, result.stdout ?? '');
            writeFileSync(`${output}/${name}.stderr`, result.stderr ?? '');
            commands.push({ name, command, args, status: result.status });
            writeFileSync(`${output}/commands.json`, JSON.stringify(commands, null, 2));
            console.log(name, 'exit', result.status);
            if (result.status !== 0) console.log((result.stderr || result.stdout || '').slice(-16000));
            return result;
          }
          function ok(result, message) { assert.equal(result.status, 0, message); return result; }
          function json(path) { return JSON.parse(readFileSync(path, 'utf8')); }
          function put(path, value) {
            mkdirSync(dirname(path), { recursive: true });
            writeFileSync(path, typeof value === 'string' ? value : JSON.stringify(value, null, 2) + '\n');
          }
          const baseline = resolve(process.env.RUNNER_TEMP, 'wp09-lint-before');
          const prepare = resolve(process.env.RUNNER_TEMP, 'wp09-lint-prepare');
          const candidate = resolve(process.env.RUNNER_TEMP, 'wp09-lint-after');
          let passed = false;
          let installedBaseline = false;
          const normalize = (text, cwd) => JSON.parse(text).map(entry => ({
            file: relative(cwd, entry.filePath), messages: entry.messages,
          })).sort((a, b) => a.file.localeCompare(b.file));
          function runtime(label, cwd) {
            const result = ok(run(label + '-runtime', 'node', ['-e', `
          const { ESLint } = require('eslint');
          (async () => {
           const eslint = new ESLint();
           const results = await eslint.lintFiles(['src/ui/Icon.tsx']);
           const loaded = Object.keys(require.cache).filter(p => p.includes('/node_modules/@eslint/config-array/') || p.includes('/node_modules/@eslint/eslintrc/'));
           const esm = loaded.filter(p => p.includes('/dist/esm/') || p.endsWith('.mjs'));
           console.log(JSON.stringify({ files: results.map(x => x.filePath), loaded, esm,
             entries: Object.fromEntries(['@eslint/config-array','@eslint/eslintrc'].map(p => [p, require.resolve(p)])) }));
          })().catch(e => { console.error(e); process.exitCode = 2; });
          `], cwd));
            const report = JSON.parse(result.stdout);
            assert.equal(report.files.length, 1);
            assert.ok(report.loaded.some(p => p.includes('/@eslint/config-array/dist/cjs/')));
            assert.ok(report.loaded.some(p => p.includes('/@eslint/eslintrc/dist/eslintrc.cjs')));
            assert.deepEqual(report.esm, []);
            console.log(label + ' RUNTIME', JSON.stringify(report));
          }
          function fixtures(label, cwd) {
            const paths = ['src/wp09LintFixture.tsx', 'src/wp09TypeFixture.ts',
              'src/engine/wp09GlobFixture.ts', 'test-results/wp09IgnoredFixture.tsx'];
            const sources = [
              'const CustomInput = () => <input aria-label="value" />;\nexport const MissingAlt = () => <><img src="local.png" /><label><CustomInput /></label><label>Label<CustomInput /></label></>;\n',
              'Promise.resolve(1);\nexport {};\n',
              'document.title;\nexport {};\n',
              'export const Ignored = () => <img />;\n',
            ];
            const config = '.wp09-fixture.config.mjs';
            paths.forEach((path, i) => put(resolve(cwd, path), sources[i]));
            put(resolve(cwd, config), `import base from './eslint.config.js';
          export default [...base, {
           files: ['src/wp09TypeFixture.ts'],
           languageOptions: { parserOptions: { projectService: true, tsconfigRootDir: ${JSON.stringify(cwd)} } },
           rules: { '@typescript-eslint/no-floating-promises': 'error' },
          }, {
           files: ['src/wp09LintFixture.tsx'],
           rules: { 'jsx-a11y/label-has-associated-control': ['error', { controlComponents: ['Custom*'] }] },
          }];\n`);
            let result;
            try {
              result = run(label + '-fixtures', 'node', ['-e', `
          const Module = require('node:module');
          const load = Module._load;
          const calls = [];
          Module._load = function(request, parent, isMain) {
           const value = load.call(this, request, parent, isMain);
           if (request !== 'minimatch' || !parent.filename.includes('/eslint-plugin-jsx-a11y/')) return value;
           return Object.assign((...args) => { calls.push(args); return value(...args); }, value);
          };
          const { ESLint } = require('eslint');
          (async () => {
           const eslint = new ESLint({ overrideConfigFile: '${config}' });
           const ignored = await eslint.isPathIgnored('${paths[3]}');
           const results = await eslint.lintFiles(${JSON.stringify(paths.slice(0,3))});
           console.log(JSON.stringify({ignored, results, calls}));
          })().catch(e => { console.error(e); process.exitCode = 2; });
          `], cwd);
            } finally {
              for (const path of [...paths, config]) rmSync(resolve(cwd, path), { force: true });
            }
            ok(result, label + ' fixture process');
            const report = JSON.parse(result.stdout);
            assert.equal(report.ignored, true);
            const results = normalize(JSON.stringify(report.results), cwd);
            for (const [file, rule] of [[paths[0], 'jsx-a11y/alt-text'],
              [paths[1], '@typescript-eslint/no-floating-promises'], [paths[2], 'no-restricted-globals']]) {
              assert.ok(results.find(x => x.file === file)?.messages.some(x => x.ruleId === rule),
                rule + ': ' + JSON.stringify(results));
            }
            assert.ok(report.calls.length > 0, 'Exercise the actual JSX-A11y minimatch callers');
            assert.ok(report.calls.every(args => args.length === 2));
            console.log(label + ' FIXTURES', JSON.stringify({ ignored:report.ignored, results,
              patterns:[...new Set(report.calls.map(args => args[1]))], calls:report.calls.length }));
            return { ignored:report.ignored, results, calls:report.calls };
          }
          try {
            assert.equal(ok(run('npm', 'npm', ['--version'])).stdout.trim(), '11.19.0');
            assert.match(process.version, /^v24\.22\./);
            console.log('NODE', process.version);
            console.log('JSX B1: CI 41303739662 confirmed latest stable 6.10.2; no newer stable version.');
            ok(run('source-fetch', 'git', ['fetch', '--no-tags', 'origin', 'a0097219532fe40f3d50872d199909d0b4258410']));
            for (const [name, cwd] of [['baseline', baseline], ['prepare', prepare]]) {
              ok(run(name + '-worktree', 'git', ['worktree', 'add', '--detach', cwd,
                'a0097219532fe40f3d50872d199909d0b4258410']));
            }
            ok(run('baseline-ci', 'npm', ['ci', '--engine-strict'], baseline));
            installedBaseline = true;
            runtime('baseline', baseline);
            const compat = {
              'tools/minimatch-compat/package.json': {
                name: '@m8e/minimatch-compat', version: '11.0.3', private: true, type: 'commonjs',
                description: 'Callable CommonJS exports backed exclusively by minimatch 11.0.3.',
                main: './index.js', dependencies: { 'minimatch-11': 'npm:minimatch@11.0.3' },
              },
              'tools/minimatch-compat/index.js': "const mm = module.require('minimatch-11');\nmodule.exports = Object.assign((...args) => mm.minimatch(...args), mm);\n",
            };
            for (const [path, value] of Object.entries(compat)) put(resolve(baseline, path), value);
            ok(run('compat-format', 'node', ['node_modules/prettier/bin/prettier.cjs', '--write', 'tools/minimatch-compat'], baseline));
            for (const path of Object.keys(compat)) {
              compat[path] = readFileSync(resolve(baseline, path), 'utf8');
              put(resolve(prepare, path), compat[path]);
            }
            const before = ok(run('baseline-eslint', 'node', ['node_modules/eslint/bin/eslint.js', '.', '--format', 'json'], baseline));
            const lintBefore = normalize(before.stdout, baseline);
            const fixturesBefore = fixtures('baseline', baseline);
            const original = json(resolve(prepare, 'package.json'));
            const parents = ['eslint', '@eslint/config-array', '@eslint/eslintrc',
              'eslint-plugin-jsx-a11y', '@typescript-eslint/typescript-estree'];
            const overrides = Object.fromEntries(parents.map(parent => [parent, { minimatch:'11.0.3' }]));
            overrides['eslint-plugin-jsx-a11y'].minimatch = 'file:./tools/minimatch-compat';
            put(resolve(prepare, 'package.json'), { ...original, overrides });
            ok(run('candidate-resolve', 'npm', ['install', '--package-lock-only', '--engine-strict'], prepare), 'file: override resolver');
            ok(run('candidate-format', 'node', [resolve(baseline, 'node_modules/prettier/bin/prettier.cjs'), '--write',
              'package.json', 'package-lock.json', 'tools/minimatch-compat'], prepare));
            ok(run('candidate-stage', 'git', ['add', 'package.json', 'package-lock.json', 'tools/minimatch-compat'], prepare));
            ok(run('candidate-local-commit', 'git', ['-c', 'user.name=WP09 CI experiment', '-c', 'user.email=wp09-ci@example.invalid',
              'commit', '-m', 'chore(deps): validate scoped minimatch 11.0.3 compatibility'], prepare));
            const commit = ok(run('candidate-local-sha', 'git', ['rev-parse', 'HEAD'], prepare)).stdout.trim();
            ok(run('candidate-clean-worktree', 'git', ['worktree', 'add', '--detach', candidate, commit]));
            assert.equal(ok(run('candidate-clean-status', 'git', ['status', '--porcelain=v1'], candidate)).stdout.trim(), '');
            ok(run('candidate-ci', 'npm', ['ci', '--engine-strict'], candidate), 'Clean-checkout npm ci with file: override');
            ok(run('candidate-tree', 'npm', ['ls', '--all'], candidate));
            const mm = ok(run('candidate-minimatch', 'npm', ['ls', 'minimatch', '--all'], candidate));
            console.log('MINIMATCH TREE', mm.stdout);
            const locked = Object.entries(json(resolve(candidate, 'package-lock.json')).packages).filter(([path, value]) =>
              path.endsWith('/minimatch') || path.endsWith('/minimatch-11') || value.name === 'minimatch');
            console.log('LOCKED MINIMATCH', JSON.stringify(locked));
            assert.ok(locked.length > 0);
            assert.ok(locked.every(([, value]) => value.link || value.version === '11.0.3'));
            console.log('V1 PASS');
            const audit = ok(run('candidate-audit', 'npm', ['audit', '--json'], candidate));
            console.log('FULL AUDIT', audit.stdout);
            console.log('V2 PASS');
            runtime('candidate', candidate);
            const after = ok(run('candidate-eslint', 'node', ['node_modules/eslint/bin/eslint.js', '.', '--format', 'json'], candidate));
            assert.deepEqual(normalize(after.stdout, candidate), lintBefore);
            console.log('V3 PASS', JSON.stringify({files:lintBefore.length,
              messages:lintBefore.reduce((n, x) => n + x.messages.length, 0)}));
            const fixturesAfter = fixtures('candidate', candidate);
            assert.deepEqual(fixturesAfter, fixturesBefore);
            console.log('V4 PASS');
            const parity = ok(run('adapter-parity', 'node', ['-e', `
          const assert = require('node:assert/strict');
          const {createRequire} = require('node:module');
          const old = createRequire(${JSON.stringify(resolve(baseline, 'package.json'))})('minimatch');
          const adapter = require('./tools/minimatch-compat');
          const modern = createRequire(require.resolve('./tools/minimatch-compat/package.json'))('minimatch-11');
          const calls = ${JSON.stringify(fixturesBefore.calls)};
          assert.equal(typeof adapter, 'function');
          assert.equal(Object.hasOwn(adapter, '__esModule'), false);
          for (const args of calls) assert.equal(adapter(...args), old(...args));
          assert.strictEqual(adapter.Minimatch, modern.Minimatch);
          console.log(JSON.stringify({calls:calls.length,patterns:[...new Set(calls.map(args => args[1]))],equal:true,callable:true,hasEsModule:false}));
          `], candidate));
            console.log('ADAPTER PARITY', parity.stdout);
            const check = ok(run('candidate-check', 'npm', ['run', 'check'], candidate));
            console.log('CHECK SUMMARY', check.stdout.split('\n').filter(line => /Test Files|Tests |gzip|benchmark|Benchmark|passed|budget/i.test(line)).join('\n'));
            console.log('V5 CHECK PASS');
            const bundle = ok(run('candidate-bundle', 'node', ['scripts/qa-bundle.mjs'], candidate));
            console.log('START GRAPH', bundle.stdout);
            ok(run('baseline-build', 'npm', ['run', 'build'], baseline));
            function fingerprint(cwd) {
              const dir = resolve(cwd, 'dist');
              return Object.fromEntries(readdirSync(dir, { recursive:true }).sort().flatMap(file => {
                if (file === 'build-info.json' || !statSync(resolve(dir, file)).isFile()) return [];
                const bytes = readFileSync(resolve(dir, file));
                return [[file, {size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')}]];
              }));
            }
            const beforeBytes = fingerprint(baseline);
            const afterBytes = fingerprint(candidate);
            assert.deepEqual(afterBytes, beforeBytes);
            console.log('BUILD PARITY PASS', JSON.stringify({files:Object.keys(afterBytes).length,
              fingerprint:createHash('sha256').update(JSON.stringify(afterBytes)).digest('hex'),excluded:['build-info.json']}));
            for (const path of ['package.json', 'package-lock.json', ...Object.keys(compat)]) {
              put(resolve(output, path), readFileSync(resolve(candidate, path), 'utf8'));
            }
            passed = true;
            console.log('BUNDLED CANDIDATE PASS: V1-V4, complete npm run check, bundle budget, production-byte parity; final required CI remains pending.');
          } catch (error) {
            console.error('BUNDLED CANDIDATE FAILED', error.stack);
            process.exitCode = 1;
          } finally {
            if (!passed && installedBaseline) {
              const result = run('old-minimatch-source', 'node', ['-e', `
          const fs = require('node:fs');
          const {createRequire} = require('node:module');
          for (const parent of ['eslint','@typescript-eslint/typescript-estree']) {
           const req = createRequire(process.cwd() + '/node_modules/' + parent + '/package.json');
           const entry = req.resolve('minimatch');
           const source = fs.readFileSync(entry, 'utf8');
           console.log(JSON.stringify({parent,entry,firstPhasePreProcess:source.includes('firstPhasePreProcess'),optimizationLevel:source.includes('optimizationLevel')}));
          }
          `], baseline);
              console.log('OLD MINIMATCH SOURCE', result.stdout);
            }
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wp09-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/wp09-security/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
