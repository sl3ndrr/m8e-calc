name: AP39 bounded diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'feat/ap39-ci-repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scientific lifecycle baseline without retry or timeout changes
        run: npx vitest run src/features/scientific/ScientificMode.test.tsx --reporter=verbose
  skipped-source:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  aggregate:
    if: ${{ always() }}
    needs: skipped-source
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.skipped-source.result }}" = skipped
  original-condition:
    needs: aggregate
    if: ${{ needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Original condition ran"
  fixed-condition:
    needs: aggregate
    if: ${{ !cancelled() && needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Explicit status condition ran"
  assert-skip-regression:
    if: ${{ always() }}
    needs: [original-condition, fixed-condition]
    runs-on: ubuntu-latest
    steps:
      - name: Compare actual GitHub scheduling without any deployment
        run: |
          test "${{ needs.original-condition.result }}" = skipped
          test "${{ needs.fixed-condition.result }}" = success
