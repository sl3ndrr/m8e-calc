name: AP35 migration evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'feat/ap35-vitest5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 874c24432df3d88def6ff6e493c2af979d339ae9
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
      - run: npm install --global npm@11.19.0
      - name: Baseline complete projects
        working-directory: baseline
        run: |
          node --version
          npm --version
          npm ci --engine-strict
          npm run test:ui -- --reporter=json --outputFile=../before-ui.json
          npm run test:engine -- --reporter=json --outputFile=../before-engine.json
      - name: Registry and regular lockfile
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync, readFileSync } from 'node:fs';
          const view = (name) => JSON.parse(execFileSync('npm', ['view', name, '--json'], { encoding: 'utf8' }));
          const v = view('vitest');
          const stable5 = v.versions.filter(x => /^5\.\d+\.\d+$/.test(x)).sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).at(-1);
          if (stable5 !== '5.0.5') throw Error('Reassess target: newest stable 5 is ' + stable5);
          const names = ['vitest@5.0.5', 'vite@8.3.4', '@vitejs/plugin-react@6.1.2', '@testing-library/jest-dom@7.0.1', 'jsdom@30.1.3'];
          const packages = Object.fromEntries(names.map(n => { const p = view(n); return [n, {version:p.version,engines:p.engines,peerDependencies:p.peerDependencies,peerDependenciesMeta:p.peerDependenciesMeta,dependencies:p.dependencies,deprecated:p.deprecated,dist:p.dist}]; }));
          writeFileSync('metadata.json', JSON.stringify({at:new Date().toISOString(),node:process.version,npm:execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),highestStable5:stable5,distTags:v['dist-tags'],packages},null,2)+'\n');
          const pkg = JSON.parse(readFileSync('package.json'));
          pkg.devDependencies.vitest = '^5.0.5';
          writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          JS
          npm install --package-lock-only --engine-strict
          rm -rf node_modules
          npm ci --engine-strict
      - name: Migrated complete projects
        run: |
          npm run test:ui -- --reporter=json --outputFile=after-ui.json
          npm run test:engine -- --reporter=json --outputFile=after-engine.json
      - name: Compare every test identity and status
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync,writeFileSync } from 'node:fs';
          const output = {files:[],titleChanges:[]};
          const relative = name => name.slice(name.lastIndexOf('/src/')+1);
          for (const project of ['ui','engine']) {
            const before = JSON.parse(readFileSync('before-'+project+'.json'));
            const after = JSON.parse(readFileSync('after-'+project+'.json'));
            assert.equal(before.numFailedTests,0); assert.equal(after.numFailedTests,0);
            assert.equal(before.numPendingTests,0); assert.equal(after.numPendingTests,0);
            const map = r => new Map(r.testResults.map(f => [relative(f.name),f]));
            const b=map(before), a=map(after);
            assert.deepEqual([...b.keys()].sort(),[...a.keys()].sort());
            for (const [path, old] of b) {
              const next=a.get(path);
              assert.equal(next.assertionResults.length,old.assertionResults.length);
              output.files.push({project,path,before:old.assertionResults.length,after:next.assertionResults.length});
              old.assertionResults.forEach((t,index)=>{
                const n=next.assertionResults[index];
                assert.equal(t.status,'passed'); assert.equal(n.status,t.status);
                assert.deepEqual(n.ancestorTitles,t.ancestorTitles);
                if(n.title!==t.title) {
                  assert.ok(['src/engine/engine.test.ts','src/engine/scientific.test.ts'].includes(path),'Unexpected title change: '+path);
                  output.titleChanges.push({project,path,index,before:t.title,after:n.title,status:n.status});
                }
              });
            }
            console.log(project, before.numTotalTests, after.numTotalTests, 'passed, same files and ordered test rows');
          }
          writeFileSync('comparison.json',JSON.stringify(output,null,2)+'\n');
          console.log('Title rendering changes',output.titleChanges.length);
          JS
          test ! -d dist
          test ! -d dist-gallery
          test ! -e test-results/ap23/modules-normal.json
      - name: Full migrated check
        run: |
          mkdir -p test-results/ap35
          mv before-ui.json before-engine.json after-ui.json after-engine.json metadata.json comparison.json test-results/ap35/
          rm -rf baseline
          npm run check
      - name: Export exact generated data
        if: always()
        run: |
          python3 <<'PY'
          import base64,gzip,pathlib
          for name in ['package-lock.json','metadata.json','comparison.json']:
              p=pathlib.Path(name) if name == 'package-lock.json' else pathlib.Path('test-results/ap35',name)
              if not p.exists(): p=pathlib.Path(name)
              if not p.exists(): continue
              data=base64.b64encode(gzip.compress(p.read_bytes())).decode()
              for i in range(0,len(data),12000): print('AP35_DATA:'+name+':'+str(i//12000)+':'+data[i:i+12000])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap35-migration-evidence
          path: |
            package-lock.json
            test-results/ap35/*.json
            metadata.json
            comparison.json
            before-*.json
            after-*.json
          if-no-files-found: error
