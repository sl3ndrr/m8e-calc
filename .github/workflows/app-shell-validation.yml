name: App shell preparation
on: pull_request
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python -m pip install fonttools brotli
      - run: python scripts/subset-fonts.py
      - run: npm run tokens
      - run: npx prettier --write .
      - run: |
          mkdir -p test-results
          git diff --binary > test-results/preparation.patch
          tar -czf test-results/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: app-shell-preparation
          path: |
            test-results/preparation.patch
            test-results/dependencies.tar.gz
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-shell-validation-results
          path: test-results/
