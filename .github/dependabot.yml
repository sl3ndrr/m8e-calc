version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    groups:
      # Only this tightly coupled pair shares a major migration PR.
      eslint-major:
        applies-to: version-updates
        patterns: ['eslint', '@eslint/js']
        update-types: ['major']
      lint-toolchain:
        applies-to: version-updates
        patterns:
          - eslint
          - '@eslint/*'
          - 'eslint-plugin-*'
          - typescript-eslint
          - '@typescript-eslint/*'
          - globals
        update-types: ['minor', 'patch']
      test-toolchain:
        applies-to: version-updates
        patterns:
          - '@testing-library/*'
          - vitest
          - '@vitest/*'
          - jsdom
          - '@playwright/*'
          - '@axe-core/*'
          - axe-core
          - fast-check
        update-types: ['minor', 'patch']
      build-toolchain:
        applies-to: version-updates
        dependency-type: development
        patterns: ['*']
        exclude-patterns: ['@types/react', '@types/react-dom']
        update-types: ['minor', 'patch']
      react-stack:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - react-aria-components
          - zustand
        update-types: ['minor', 'patch']
      codemirror:
        applies-to: version-updates
        patterns: ['@codemirror/*', '@lezer/*']
        update-types: ['minor', 'patch']
      local-font-sources:
        applies-to: version-updates
        patterns: ['@fontsource-variable/*']
        update-types: ['minor', 'patch']
      runtime:
        applies-to: version-updates
        dependency-type: production
        patterns: ['*']
        # Visual and pre-1.0 changes always receive individual review PRs.
        exclude-patterns:
          - '@material/material-color-utilities'
          - material-symbols
          - katex
          - motion
        update-types: ['minor', 'patch']
    # Security updates keep Dependabot's individual-PR behavior. No ignores.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
